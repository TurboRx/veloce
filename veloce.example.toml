# Veloce Configuration Example

[server]
host = "0.0.0.0"
port = 8080
public_base_url = "http://localhost:8080"

[database]
host = "localhost"
port = 5432
user = "postgres"
password = "veloce_dev_password"
database = "veloce"
ssl_mode = "disable"

[storage]
endpoint = "localhost:9000"
access_key_id = "veloce"
secret_access_key = "veloce_storage_password"
bucket = "veloce-assets"
use_ssl = false

[encryption]
# 32-byte hex string used for AES encrypting stored Discord bot tokens
# Generate with: openssl rand -hex 32
token_encryption_key = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

[discord]
# Discord OAuth2 application credentials
client_id = ""
client_secret = ""
redirect_uri = "http://localhost:8080/v1/auth/callback"
