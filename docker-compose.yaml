services:
  veloce:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: "postgres://postgres:veloce_dev_password@postgres:5432/veloce?sslmode=disable"
      TOKEN_ENCRYPTION_KEY: "${TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      DISCORD_REDIRECT_URI: "${DISCORD_REDIRECT_URI:-http://localhost:8080/v1/auth/callback}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: veloce_dev_password
      POSTGRES_DB: veloce
      PGUSER: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - veloce-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veloce"]
      interval: 3s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server --console-address ":9001" /data
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: veloce
      MINIO_ROOT_PASSWORD: veloce_storage_password
    volumes:
      - veloce-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  veloce-postgres-data:
  veloce-minio-data:
